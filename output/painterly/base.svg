<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3f6a6e"/><stop offset="1" stop-color="#1c2f38"/></linearGradient>
  <radialGradient id="light" cx="25%" cy="20%" r="55%">
    <stop offset="0" stop-color="#ffd590" stop-opacity="0.85"/><stop offset="1" stop-color="#ffd590" stop-opacity="0"/></radialGradient>
  <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a5a34"/><stop offset="1" stop-color="#3e2414"/></linearGradient>
  <radialGradient id="cush" cx="40%" cy="30%" r="70%">
    <stop offset="0" stop-color="#c8553d"/><stop offset="1" stop-color="#5e1f18"/></radialGradient>
  <radialGradient id="body" cx="35%" cy="30%" r="75%">
    <stop offset="0" stop-color="#ffc77a"/><stop offset="0.5" stop-color="#e48a3c"/><stop offset="1" stop-color="#7a3b16"/></radialGradient>
  <radialGradient id="head" cx="38%" cy="32%" r="70%">
    <stop offset="0" stop-color="#ffd08a"/><stop offset="0.55" stop-color="#e8903f"/><stop offset="1" stop-color="#8a4519"/></radialGradient>
  <radialGradient id="white" cx="40%" cy="30%" r="70%">
    <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#d8c6a8"/></radialGradient>
  <radialGradient id="eye" cx="40%" cy="40%" r="60%">
    <stop offset="0" stop-color="#d9e86a"/><stop offset="0.7" stop-color="#8fa52c"/><stop offset="1" stop-color="#4a5a12"/></radialGradient>
  <radialGradient id="pot" cx="35%" cy="35%" r="70%">
    <stop offset="0" stop-color="#e9e2d0"/><stop offset="1" stop-color="#7e7462"/></radialGradient>
  <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="1000"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="blur6" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="1000"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="800" height="1000" fill="url(#wall)"/>
<!-- window -->
<rect x="60" y="60" width="300" height="380" fill="#f6e2b0" opacity="0.55" filter="url(#blur6)"/>
<path d="M210 60 V440 M60 250 H360" stroke="#2d4a50" stroke-width="16" filter="url(#soft)"/>
<rect width="800" height="1000" fill="url(#light)"/>
<!-- plant -->
<g filter="url(#soft)">
  <path d="M640 600 C 600 450, 560 420, 520 380" stroke="#2f5a2a" stroke-width="10" fill="none"/>
  <ellipse cx="530" cy="400" rx="60" ry="22" transform="rotate(-35 530 400)" fill="#4d8a3a"/>
  <ellipse cx="610" cy="430" rx="70" ry="24" transform="rotate(-70 610 430)" fill="#3e7a32"/>
  <ellipse cx="690" cy="470" rx="70" ry="24" transform="rotate(-120 690 470)" fill="#5c9a44"/>
  <ellipse cx="700" cy="560" rx="60" ry="20" transform="rotate(-160 700 560)" fill="#3a6d2e"/>
  <ellipse cx="580" cy="520" rx="55" ry="18" transform="rotate(-20 580 520)" fill="#6aa850"/>
  <path d="M580 600 L 700 600 L 685 720 L 595 720 Z" fill="url(#pot)"/>
</g>
<!-- table -->
<rect y="720" width="800" height="280" fill="url(#table)"/>
<path d="M0 720 H800" stroke="#b07a48" stroke-width="6"/>
<!-- cushion -->
<ellipse cx="330" cy="800" rx="270" ry="80" fill="#2a1408" opacity="0.5" filter="url(#blur6)"/>
<ellipse cx="330" cy="770" rx="260" ry="75" fill="url(#cush)"/>
<!-- tail -->
<path d="M470 760 C 590 770, 610 700, 560 650" stroke="#c46a28" stroke-width="40" fill="none" stroke-linecap="round" filter="url(#soft)"/>
<!-- body -->
<ellipse cx="320" cy="640" rx="175" ry="150" fill="url(#body)" filter="url(#soft)"/>
<ellipse cx="300" cy="640" rx="80" ry="120" fill="url(#white)" filter="url(#soft)"/>
<!-- body stripes -->
<g stroke="#8a4217" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#soft)">
  <path d="M420 540 Q 460 570 470 620"/><path d="M430 600 Q 470 630 475 680"/><path d="M420 660 Q 455 690 455 730"/>
</g>
<!-- front legs -->
<path d="M240 650 Q 230 740 250 770 L 300 770 Q 300 700 290 650 Z" fill="url(#white)" filter="url(#soft)"/>
<path d="M320 650 Q 320 740 330 770 L 380 770 Q 385 700 370 650 Z" fill="url(#white)" filter="url(#soft)"/>
<!-- ears -->
<path d="M195 400 L 215 255 L 300 345 Z" fill="#d97c34" filter="url(#soft)"/>
<path d="M435 390 L 440 245 L 355 335 Z" fill="#b8642a" filter="url(#soft)"/>
<path d="M215 380 L 225 295 L 275 350 Z" fill="#e8a59a" filter="url(#soft)"/>
<path d="M418 375 L 423 290 L 375 345 Z" fill="#c98a80" filter="url(#soft)"/>
<!-- head -->
<ellipse cx="315" cy="420" rx="145" ry="125" fill="url(#head)" filter="url(#soft)"/>
<!-- forehead stripes -->
<g stroke="#9a4c1c" stroke-width="9" stroke-linecap="round" opacity="0.75" filter="url(#soft)">
  <path d="M315 305 L 315 350"/><path d="M285 310 L 293 350"/><path d="M345 310 L 337 350"/>
  <path d="M190 420 L 225 425"/><path d="M195 450 L 228 448"/><path d="M440 420 L 405 425"/><path d="M435 450 L 402 448"/>
</g>
<!-- muzzle -->
<ellipse cx="315" cy="478" rx="72" ry="52" fill="url(#white)" filter="url(#soft)"/>
<!-- eyes -->
<g>
  <ellipse cx="262" cy="410" rx="30" ry="26" fill="url(#eye)"/>
  <ellipse cx="368" cy="410" rx="30" ry="26" fill="url(#eye)"/>
  <ellipse cx="262" cy="412" rx="7" ry="22" fill="#111"/>
  <ellipse cx="368" cy="412" rx="7" ry="22" fill="#111"/>
  <circle cx="252" cy="400" r="6" fill="#fff"/><circle cx="358" cy="400" r="6" fill="#fff"/>
  <path d="M232 405 Q 262 378 292 405" stroke="#3a1a08" stroke-width="5" fill="none"/>
  <path d="M338 405 Q 368 378 398 405" stroke="#3a1a08" stroke-width="5" fill="none"/>
</g>
<!-- nose mouth -->
<path d="M302 458 L 328 458 L 315 474 Z" fill="#d9707a"/>
<path d="M315 474 Q 315 492 296 494 M315 474 Q 315 492 334 494" stroke="#4a2414" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<g stroke="#fff6e8" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
  <path d="M255 478 Q 200 465 150 470"/><path d="M255 488 Q 200 490 155 505"/>
  <path d="M375 478 Q 430 465 480 470"/><path d="M375 488 Q 430 490 475 505"/>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#fff6e5"/><stop offset="1" stop-color="#ffd9a8"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- tail -->
  <path d="M420 470 C 540 470, 560 360, 500 320" stroke="#f0a050" stroke-width="34" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="300" cy="455" rx="150" ry="110" fill="#f4a95c"/>
  <ellipse cx="300" cy="475" rx="80" ry="70" fill="#fff1dd"/>
  <!-- paws -->
  <ellipse cx="240" cy="555" rx="40" ry="22" fill="#fff1dd"/>
  <ellipse cx="360" cy="555" rx="40" ry="22" fill="#fff1dd"/>
  <!-- ears -->
  <path d="M175 210 L 195 70 L 280 160 Z" fill="#f4a95c"/>
  <path d="M425 210 L 405 70 L 320 160 Z" fill="#f4a95c"/>
  <path d="M195 190 L 205 105 L 255 160 Z" fill="#ffb7b7"/>
  <path d="M405 190 L 395 105 L 345 160 Z" fill="#ffb7b7"/>
  <!-- head -->
  <ellipse cx="300" cy="260" rx="155" ry="130" fill="#f4a95c"/>
  <!-- stripes -->
  <path d="M300 135 L 300 180 M270 140 L 278 178 M330 140 L 322 178" stroke="#d9823a" stroke-width="10" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="300" cy="310" rx="75" ry="50" fill="#fff1dd"/>
  <!-- eyes -->
  <ellipse cx="245" cy="250" rx="26" ry="32" fill="#2b2b2b"/>
  <ellipse cx="355" cy="250" rx="26" ry="32" fill="#2b2b2b"/>
  <circle cx="254" cy="238" r="9" fill="#fff"/><circle cx="364" cy="238" r="9" fill="#fff"/>
  <circle cx="240" cy="262" r="4" fill="#fff"/><circle cx="350" cy="262" r="4" fill="#fff"/>
  <!-- cheeks -->
  <ellipse cx="200" cy="300" rx="22" ry="12" fill="#ff9c9c" opacity="0.6"/>
  <ellipse cx="400" cy="300" rx="22" ry="12" fill="#ff9c9c" opacity="0.6"/>
  <!-- nose & mouth -->
  <path d="M288 290 L 312 290 L 300 304 Z" fill="#e8737a"/>
  <path d="M300 304 Q 300 322 282 322 M300 304 Q 300 322 318 322" stroke="#5a3a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#5a3a2a" stroke-width="3" stroke-linecap="round">
    <line x1="230" y1="305" x2="140" y2="290"/><line x1="230" y1="315" x2="140" y2="320"/>
    <line x1="370" y1="305" x2="460" y2="290"/><line x1="370" y1="315" x2="460" y2="320"/>
  </g>
</svg>
